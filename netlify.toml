[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "ANALYTICS_ID,GOOGLE_FORM_URL"
  SECRETS_SCAN_OMIT_PATHS = "src/config.js,scripts/build-quizzes.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

